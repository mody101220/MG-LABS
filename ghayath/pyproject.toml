[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghayath-core"
version = "1.0.0"
description = "GHAYATH PERSONAL AI - production FastAPI core built from the v1.0 API contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "httpx>=0.27",
    "croniter>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "openapi-spec-validator>=0.7",
    "datamodel-code-generator>=0.26",
    "pgserver>=0.1.4",
    "mypy>=1.10",
    "pyflakes>=3.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
