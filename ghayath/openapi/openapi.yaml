          $ref: '#/components/responses/NotFound'
  /events/stream:
    get:
      tags:
      - Events
      operationId: getEventsStream
      summary: Server-Sent Events stream (realtime dashboard feed)
      description: "SSE from the `events` table. Cursor = last event ULID (`since`).\n\
        Heartbeat comment every 15s. Reconnect with `since=<last id>` → no loss,\nno duplicates.\n\
        AUTH (documented exception — the only path allowing a query token):\n  - `Authorization:\
        \ Bearer <token>` (preferred), or\n  - `?access_token=<token>` (EventSource compatibility;\
        \ use short-lived\n    access tokens — the token is visible in the URL).\nRoles:\
        \ OWNER, VIEWER. (AGENT excluded — least privilege.)\n"
      parameters:
      - name: since
        in: query
        required: false
        description: Event ULID cursor; omitted = start from now
        schema:
          type: string
      - name: types
        in: query
        required: false
        description: Comma-separated event names (from v1 events.event enum)
        schema:
          type: string
      - name: access_token
        in: query
        required: false
        description: 'PROPOSAL exception: bearer token via query for EventSource'
        schema:
          type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /incidents/{incident_id}:
    patch:
      tags:
      - Incidents
      operationId: patchIncident
      summary: Transition incident status
      description: "OWNER, AGENT. Allowed transitions (else 409 CONFLICT):\n  OPEN→INVESTIGATING|RESOLVED;\
        \ INVESTIGATING→MITIGATED|RESOLVED;\n  MITIGATED→RESOLVED|INVESTIGATING; RESOLVED→CLOSED;\
        \ CLOSED→(terminal).\nNo-op (same status) → 409. `resolved_at` auto-set on RESOLVED.\n\
        `resolution_note` is recorded ONLY in audit_logs.details (no DDL change).\nIdempotency-Key\
        \ REQUIRED (24h TTL, v1 semantics).\n"
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentStatusUpdateRequest'
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeIncident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition not allowed per the state matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Transition CLOSED→INVESTIGATING is not allowed
                      details: {}
                    request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                    timestamp: '2026-09-11T20:00:05Z'

