openapi: 3.1.0

info:
  title: "GHAYATH PERSONAL AI - Core API"
  version: "1.2.0"
  description: |
    REST/JSON API contract for **GHAYATH PERSONAL AI** (v1.2) — a Modular Agentic
    Architecture where an autonomous agent monitors and operates the owner's projects,
    inboxes, and communications under strict permission + approval control.

    ## Global rules

    **Envelope.** Every response (success or error) uses exactly the standard envelope:

    ```json
    { "success": true,  "data": { }, "request_id": "req_01J...", "timestamp": "2026-09-11T20:00:00Z" }
    { "success": false, "error": { "code": "PERMISSION_DENIED", "message": "...", "details": { } },
      "request_id": "req_01J...", "timestamp": "2026-09-11T20:00:00Z" }
    ```

    **Time.** All timestamps are ISO-8601 UTC (`...Z`) internally. Clients convert to
    the display timezone. Dates use `YYYY-MM-DD`.

    **IDs.** String identifiers with domain prefixes (ULID-based, human-greppable,
    log-safe): `usr_`, `prj_`, `ts_`, `mem_`, `cmd_`, `plan_`, `exec_`, `appr_`,
    `auto_`, `notf_`, `inc_`, `conv_`, `msg_` (email), `wmsg_` (WhatsApp),
    `draft_`, `repo_`, `iss_`, `evt_`, `req_`, `chk_`.

    **Authentication.** `Authorization: Bearer <JWT>` on every operation except
    `POST /auth/login`, `GET /health`, and `POST /webhooks/whatsapp`
    (signed via `X-Webhook-Signature`, HMAC-SHA256 of the raw body).
    Roles (RBAC): `OWNER` (full control), `AGENT` (service principal of the internal
    agent — never grants itself permissions), `VIEWER` (read-only dashboard).

    **Idempotency.** Mutating operations that can be retried accept the
    `Idempotency-Key` header (required where marked). Retries with the same key
    return the original response and never re-execute the side effect
    (no double WhatsApp/Email sends, no double executions). Keys are stored 24h.

    **Correlation.** Any request may carry an optional `X-Request-Id` header
    (max 64 chars) for client-side correlation; when absent the gateway
    generates one. The id is always returned in the envelope (`request_id`).

    **Rate limiting.** Applied at the gateway. Limits: auth 5/min, agent commands
    60/min, WhatsApp/Email provider-dependent, monitoring per scheduler.
    On excess → `429` with code `RATE_LIMITED`.

    **Error code → HTTP mapping (fixed set, do not extend without a spec revision):**

    | Code | HTTP |
    |---|---|
    | `VALIDATION_ERROR` | 400 |
    | `AUTHENTICATION_FAILED`, `INVALID_TOKEN` | 401 |
    | `PERMISSION_DENIED`, `SECRET_ACCESS_DENIED` | 403 |
    | `RESOURCE_NOT_FOUND` | 404 |
    | `CONFLICT`, `APPROVAL_REQUIRED` | 409 |
    | `RATE_LIMITED` | 429 |
    | `EXECUTION_FAILED`, `VERIFICATION_FAILED`, `DEPENDENCY_FAILURE` | 500 |
    | `INTEGRATION_OFFLINE`, `TOOL_UNAVAILABLE` | 503 |
    | `TIMEOUT` | 504 |

    **Agent safety (architectural rule #30).** The LLM never calls external services
    directly. Every action flows:
    `LLM → Planner → Tool Router → Permission Engine → Action Executor → External API → Verification → Audit Log`.
    Sensitive actions (send, execute, commit/merge, delete) require explicit permission
    and/or human approval (`APPROVAL_REQUIRED`).

    **Audit.** The audit log is append-only and immutable for the agent.
externalDocs:
  description: Human-readable contract (Arabic)
  url: ../docs/api-contract-specification-v1.0.md

servers:
  - url: /api/v1
    description: Core API behind the API Gateway (auth, rate limiting, validation, authorization)

tags:
  - name: Auth
    description: Login, token refresh, logout
  - name: Agent
    description: Natural-language commands and plan execution
  - name: Projects
    description: Project registry and detail
  - name: Tasks
    description: Task management with verification-gated completion
  - name: Memory
    description: Structured long-term memory
  - name: WhatsApp
    description: WhatsApp integration status and outbound messages
  - name: Webhooks
    description: Inbound provider webhooks (signed)
  - name: Email
    description: Inbox, drafts, and sending
  - name: GitHub
    description: Repositories, repo health, issues
  - name: Monitoring
    description: Active health checks
  - name: Automations
    description: Scheduled/event-driven automations
  - name: Approvals
    description: Human-in-the-loop approvals
  - name: Permissions
    description: RBAC permission state and checks
  - name: Notifications
    description: Outbound notifications with severity routing
  - name: Audit
    description: Append-only audit trail
  - name: Incidents
    description: Emergency incidents
  - name: System
    description: Health and system status
  - name: Brief
    description: Daily brief

security:
  - bearerAuth: []

paths:

  # ─────────────────────────── AUTH ───────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: User login
      description: |
        Exchanges credentials for access + refresh tokens.
        Rate limit: 5 requests/minute per account (429 on excess).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: "********"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: AUTHENTICATION_FAILED
                  message: "Email or password is incorrect"
                  details: {}
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      description: |
        Rotates the refresh token: a new refresh token is issued and the old one
        is invalidated (reuse of a rotated token revokes the session).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token invalid, expired, or already rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_TOKEN
                  message: "Refresh token is invalid or expired"
                  details: {}
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout
      description: Invalidates the active session/refresh token. Idempotent — a second call is a no-op success.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Empty body.
      responses:
        '200':
          description: Session invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────── AGENT ───────────────────────────

  /agent/command:
    post:
      tags: [Agent]
      operationId: agentCommand
      summary: Submit a natural-language command
      description: |
        The main entry point for natural-language commands (Arabic or English).
        The Planner classifies the intent and produces an executable plan.
        Nothing is executed yet — execution requires `POST /agent/execute`
        (and human approval when the plan contains sensitive actions).
        Rate limit: 60 requests/minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommandRequest'
            example:
              command: "تابعلي مشروع SANAA"
              source: dashboard
              conversation_id: conv_001
              autonomous: true
      responses:
        '201':
          description: Command accepted and plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCommandResponse'
              example:
                success: true
                data:
                  command_id: cmd_001
                  intent: PROJECT_MONITORING
                  status: PLANNED
                  plan:
                    - task: GET_PROJECT_STATUS
                      status: PENDING
                    - task: CHECK_OPEN_ISSUES
                      status: PENDING
                    - task: CHECK_DEPLOYMENT
                      status: PENDING
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Role does not allow autonomous agent commands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /agent/execute:
    post:
      tags: [Agent]
      operationId: agentExecute
      summary: Execute an approved plan
      description: |
        Starts execution of a plan created by `POST /agent/command`.
        - If the plan is fully permitted → execution starts (`RUNNING`).
        - If any step needs human approval → `409 APPROVAL_REQUIRED` and an
          approval record is created (id in `error.details.approval_id`).
        - A plan not in `PLANNED`/`WAITING_APPROVAL` state → `409 CONFLICT`.
        Execution is asynchronous: follow state via the execution's status,
        events, notifications, and the daily brief.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecuteRequest'
            example:
              command_id: cmd_001
              approval_id: null
      responses:
        '202':
          description: Execution accepted and running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecuteResponse'
              example:
                success: true
                data:
                  execution_id: exec_001
                  command_id: cmd_001
                  status: RUNNING
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:05Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Approval required, or command is not in an executable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                approvalRequired:
                  value:
                    success: false
                    error:
                      code: APPROVAL_REQUIRED
                      message: "Human approval is required before executing this plan"
                      details:
                        approval_id: appr_001
                    request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                    timestamp: "2026-09-11T20:00:05Z"
                conflict:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: "Command is not in PLANNED or WAITING_APPROVAL state"
                      details:
                        command_id: cmd_001
                        status: COMPLETED
                    request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                    timestamp: "2026-09-11T20:00:05Z"
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────── PROJECTS ───────────────────────────

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      description: Returns project summaries (newest activity first).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Project list
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-Total-Pages:
              $ref: '#/components/headers/XTotalPages'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
              example:
                success: true
                data:
                  - id: prj_sanaa
                    name: SANAA
                    status: ACTIVE
                    priority: P1
                    version: "1.0"
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: SANAA
              description: "منصة طلب الخدمات والحرفيين"
              priority: P1
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: CONFLICT
                  message: "Project with name 'SANAA' already exists"
                  details:
                    name: SANAA
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'

  /projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get project detail
      description: |
        Full project snapshot: identity, repository, deployment, task/bug/security
        counters, dependencies, integrations, last activity, and next action.
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: Partial update. `version` bumps create a new version marker; `next_action` is the owner-visible pointer.
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
            example:
              status: ACTIVE
              version: "1.1"
              priority: P1
              next_action: Production deployment
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ─────────────────────────── TASKS ───────────────────────────

  /tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              project_id: prj_sanaa
              title: "فحص API authentication"
              priority: P1
              status: TODO
              due_at: "2026-09-15T12:00:00Z"
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      description: Filtered, paginated task list (most urgent first by default).
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^prj_[a-z0-9]+$'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Priority'
        - name: assignee
          in: query
          required: false
          schema:
            type: string
          description: User id or agent principal.
        - name: due_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only tasks due before this UTC instant.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Task list
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-Total-Pages:
              $ref: '#/components/headers/XTotalPages'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /tasks/{task_id}:
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      description: Partial update. Moving a task to `DONE` directly is NOT allowed — use `POST /tasks/{task_id}/complete` (verification-gated).
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              status: IN_PROGRESS
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition (e.g. re-opening a DONE task)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /tasks/{task_id}/complete:
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: Complete a task (verification-gated)
      description: |
        A task is NOT complete just because the agent says it is.
        - `verification.required = true` → task moves to `IN_REVIEW`; it becomes
          `DONE` only after independent verification passes.
        - `verification.required = false` → task becomes `DONE` immediately
          (still recorded in the audit log with the claiming principal).
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCompleteRequest'
            example:
              verification:
                required: true
      responses:
        '200':
          description: Completion accepted (task is DONE or IN_REVIEW pending verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompleteResponse'
              example:
                success: true
                data:
                  task_id: ts_001
                  status: IN_REVIEW
                  verification_status: PENDING
                  verification_id: ver_001
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task is already completed or in a non-completable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ─────────────────────────── MEMORY ───────────────────────────

  /memory:
    post:
      tags: [Memory]
      operationId: createMemory
      summary: Write a memory record
      description: |
        Structured long-term memory. Upsert semantics: writing the same
        `(type, key, project_id)` updates the existing record.
        `source = verified` marks facts confirmed by an external system or the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
            example:
              type: PROJECT_MEMORY
              key: sanaa.current_version
              value: "1.0"
              source: verified
      responses:
        '201':
          description: Memory record written (or updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing MEMORY.WRITE permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Memory]
      operationId: listMemory
      summary: Query memory records
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MemoryType'
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^prj_[a-z0-9]+$'
        - name: key
          in: query
          required: false
          schema:
            type: string
          description: Exact key match.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Memory records
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-Total-Pages:
              $ref: '#/components/headers/XTotalPages'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /memory/{memory_id}:
    delete:
      tags: [Memory]
      operationId: deleteMemory
      summary: Delete a memory record
      description: Requires the `MEMORY.DELETE` permission (agent never holds it by default). Deletion is audit-logged with the full removed record in `details`.
      parameters:
        - $ref: '#/components/parameters/MemoryIdParam'
      responses:
        '200':
          description: Memory record deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteResponse'
              example:
                success: true
                data:
                  memory_id: mem_001
                  deleted: true
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing MEMORY.DELETE permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: PERMISSION_DENIED
                  message: "Required permission is missing"
                  details:
                    required: MEMORY.DELETE
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ─────────────────────────── WHATSAPP ───────────────────────────

  /integrations/whatsapp/status:
    get:
      tags: [WhatsApp]
      operationId: getWhatsappStatus
      summary: WhatsApp integration status
      description: Connectivity and currently granted permissions for the WhatsApp integration.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppStatusResponse'
              example:
                success: true
                data:
                  connected: true
                  provider: whatsapp
                  permissions: [READ, REPLY]
                  last_checked_at: "2026-09-11T20:00:00Z"
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /whatsapp/messages/send:
    post:
      tags: [WhatsApp]
      operationId: sendWhatsappMessage
      summary: Send a WhatsApp message
      description: |
        Pipeline before the message leaves the system:
        `AUTHORIZATION → PERMISSION CHECK → RECIPIENT VALIDATION → CONTENT POLICY → SEND → VERIFY → AUDIT`.

        - Missing `WHATSAPP.SEND`/`WHATSAPP.REPLY` permission → `403 PERMISSION_DENIED`
          (or `409 APPROVAL_REQUIRED` when the owner can grant it via approval).
        - Invalid E.164 recipient → `400 VALIDATION_ERROR` (`details.field = recipient`).
        - Content policy violation → `400 VALIDATION_ERROR` (`details.policy = content_policy`).
        - Provider not connected → `503 INTEGRATION_OFFLINE`.
        - **Idempotency is mandatory:** a retry with the same `Idempotency-Key`
          returns the original result and never sends twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendWhatsAppRequest'
            example:
              recipient: "+963991234567"
              message: "مرحبا، محمد مشغول حاليا."
      responses:
        '200':
          description: Message accepted (queued or sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendWhatsAppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Human approval required before sending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: APPROVAL_REQUIRED
                  message: "Human approval is required before sending"
                  details:
                    approval_id: appr_001
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/IntegrationOffline'

  # ─────────────────────────── WEBHOOKS ───────────────────────────

  /webhooks/whatsapp:
    post:
      tags: [Webhooks]
      operationId: whatsappWebhook
      summary: Inbound WhatsApp message webhook
      description: |
        Provider-signed inbound webhook. The gateway verifies
        `X-Webhook-Signature` (HMAC-SHA256 of the raw body) and the provider's
        sender allow-list before accepting.
        Processing is asynchronous: the message is persisted and classified
        (`PERSONAL | BUSINESS | CLIENT | PROJECT | URGENT | SPAM | UNKNOWN`) by the
        agent; results surface via notifications, the daily brief, and events.
        Duplicate `message_id`s are dropped (idempotent).
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookWhatsAppRequest'
            example:
              event: message.received
              message_id: wamid.HBgM...
              sender: "+963991234567"
              text: "مرحبا محمد، بدي احكي معك بخصوص المشروع"
              timestamp: "2026-09-11T20:00:00Z"
      responses:
        '202':
          description: Message accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWhatsAppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Signature or sender validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: AUTHENTICATION_FAILED
                  message: "Webhook signature validation failed"
                  details: {}
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'

