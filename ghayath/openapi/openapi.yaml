        '429':
          $ref: '#/components/responses/RateLimited'

  /email/drafts:
    post:
      tags: [Email]
      operationId: createEmailDraft
      summary: Create an email draft
      description: |
        Creates a draft (never sends). Provide `reply_to` (message id) to derive
        recipient + `Re:` subject, or `to` for a new thread.
        Requires `EMAIL.DRAFT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
            example:
              reply_to: msg_001
              body: "شكرا لرسالتك..."
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
              example:
                success: true
                data:
                  id: draft_001
                  reply_to: msg_001
                  to: client@example.com
                  subject: "Re: Project Update"
                  body: "شكرا لرسالتك..."
                  status: DRAFT
                  approval_id: null
                  sent_message_id: null
                  created_at: "2026-09-11T20:00:00Z"
                  updated_at: "2026-09-11T20:00:00Z"
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing EMAIL.DRAFT permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: reply_to message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /email/send:
    post:
      tags: [Email]
      operationId: sendEmail
      summary: Send an email draft
      description: |
        Sends the draft through the pipeline
        `PERMISSION CHECK → CONTENT POLICY → APPROVAL (if high-impact) → SEND → VERIFY → AUDIT`.
        - High-impact messages (client commitments, financial, contractual) are blocked
          with `409 APPROVAL_REQUIRED` — `error.details.approval_id` points to the
          approval that must be granted first.
        - **Idempotency is mandatory** (a retry must never double-send).
        - Missing `EMAIL.SEND` permission → `403` (or `409 APPROVAL_REQUIRED`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
            example:
              draft_id: draft_001
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Human approval required before sending (high-impact)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: APPROVAL_REQUIRED
                  message: "Human approval is required before sending"
                  details:
                    approval_id: appr_001
                    draft_id: draft_001
                request_id: req_01J9ZK7Q3M4N5P6R7S8T9V
                timestamp: "2026-09-11T20:00:00Z"
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/IntegrationOffline'

